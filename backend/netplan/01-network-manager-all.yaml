# Live copy from 192.168.48.254 /etc/netplan/01-network-manager-all.yaml
# Interface names are this host. Other NICs need the addresses kept, names may change.
network:
  version: 2
  renderer: NetworkManager
  ethernets:
    ens33:
      dhcp4: false
      addresses:
        - 192.168.48.254/24
      nameservers:
        addresses:
          - 8.8.8.8
        search: []
      routes:
        - to: 192.168.10.0/23
          to: 192.168.92.0/24
          to: 192.168.47.0/24
          via: 192.168.48.1
    ens160:
      dhcp4: false
      addresses:
        - 30.0.0.10/24
        - 30.0.0.11/24
        - 30.0.0.12/24
      nameservers:
        addresses:
        - 8.8.8.8
        search: []
      routes:
        - to: default
          via: 30.0.0.1
