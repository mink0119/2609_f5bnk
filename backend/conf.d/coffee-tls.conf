# Additive TLS vhost for 3.3–3.9. Do not replace coffee.conf.
# Copy to /etc/nginx/conf.d/ only after HTTP 2.x tests finish.
server {
    listen 30.0.0.10:443 ssl;
    server_name coffee.f5bnk.com _;
    access_log /var/log/nginx/poc-access.log poc_headers;

    ssl_certificate     /etc/nginx/poc-certs/coffee.crt;
    ssl_certificate_key /etc/nginx/poc-certs/coffee.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        add_header X-Echo-Host $http_host always;
        add_header X-Echo-Uri $request_uri always;
        return 200 "COFFEE TLS - 30.0.0.10\n";
    }
}
