# http 컨텍스트 (nginx.conf 가 conf.d 를 include).
# 요청 헤더 전체는 echo 모듈 $echo_client_request_headers.
# 값에 CR/LF 가 있어서 escape=json 으로 한 줄로 남긴다.
log_format poc_headers escape=json
    '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
    'server=$server_addr:$server_port '
    'req_headers="$echo_client_request_headers"';
