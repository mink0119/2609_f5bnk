# Additive TLS vhost for 3.3 / 3.6 / 3.7 mismatch. Do not replace tea.conf.
server {
    listen 30.0.0.11:443 ssl;
    server_name tea.f5bnk.com _;
    access_log /var/log/nginx/poc-access.log;

    ssl_certificate     /etc/nginx/poc-certs/tea.crt;
    ssl_certificate_key /etc/nginx/poc-certs/tea.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        add_header X-Echo-Host $http_host always;
        add_header X-Echo-Uri $request_uri always;
        return 200 "TEA TLS - 30.0.0.11\n";
    }
}
