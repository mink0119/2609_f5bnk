server {
    listen 30.0.0.11:80;
    server_name _;
    access_log /var/log/nginx/poc-access.log;

    # 2.39 — Host tea 는 timeout 없음. /delay/8 이 8s 200 이어야 함.
    location /delay/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    location / {
        default_type text/plain;
        add_header X-Echo-Host $http_host always;
        add_header X-Echo-Uri $request_uri always;
        add_header X-Echo-Method $request_method always;
        add_header X-Echo-Env $http_env always;
        add_header X-Echo-X-Backend $http_x_backend always;
        return 200 "TEA SERVER - 30.0.0.11\n";
    }
}
