# 2.41 iRule 우회. native retry.attempts 미적용. HTTP::retry 최대 3회 (총 1+3).
# HTTP::retry 는 원요청 문자열 필수. HTTP::retry 는 HTTP_REQUEST 를 다시 타므로 카운터는 info exists 로 유지.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class
  addresses:
    - type: IPAddress
      value: 40.30.20.20
  listeners:
    - name: bnk-listener
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: retry-attempts-irule-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener
  hostnames:
    - coffee.f5bnk.com
  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com
---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 80
---
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: irule-retry-attempts
  namespace: web
spec:
  iRule: |
    when HTTP_REQUEST {
      set req [HTTP::request]
      if { ![info exists retries] } {
        set retries 0
      }
    }
    when HTTP_RESPONSE {
      if { [HTTP::status] == 503 && $retries < 3 } {
        incr retries
        HTTP::retry $req
        return
      }
      set retries 0
    }
---
apiVersion: gateway.k8s.f5net.com/v1alpha1
kind: BNKNetPolicy
metadata:
  name: netpolicy-retry-attempts
  namespace: web
spec:
  extensionRefs:
    - kind: F5BigCneIrule
      name: irule-retry-attempts
      group: k8s.f5net.com
  targetRefs:
    - kind: Gateway
      name: http-gw
      group: gateway.networking.k8s.io
      sectionName: bnk-listener
