# 2.32 iRule 우회. preflight(OPTIONS+Origin+ACR-Method) → 204 + Max-Age / Expose-Headers.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class
  addresses:
    - type: IPAddress
      value: 40.30.20.20
  listeners:
    - name: bnk-listener
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cors-expose-maxage-irule-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener
  hostnames:
    - coffee.f5bnk.com
  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com
---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 80
---
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: irule-cors-expose
  namespace: web
spec:
  iRule: |
    when HTTP_REQUEST {
      if { [HTTP::method] eq "OPTIONS" && [HTTP::header "Origin"] eq "https://shop.f5bnk.com" && [HTTP::header exists "Access-Control-Request-Method"] } {
        HTTP::respond 204 noserver \
          "Access-Control-Allow-Origin" "https://shop.f5bnk.com" \
          "Access-Control-Allow-Methods" "GET" \
          "Access-Control-Max-Age" "3600" \
          "Access-Control-Expose-Headers" "X-Request-Id, X-Echo-Host"
        return
      }
    }
---
apiVersion: gateway.k8s.f5net.com/v1alpha1
kind: BNKNetPolicy
metadata:
  name: netpolicy-cors-expose
  namespace: web
spec:
  extensionRefs:
    - kind: F5BigCneIrule
      name: irule-cors-expose
      group: k8s.f5net.com
  targetRefs:
    - kind: Gateway
      name: http-gw
      group: gateway.networking.k8s.io
      sectionName: bnk-listener
