apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class

  addresses:
    - type: IPAddress
      value: 40.30.20.20

  listeners:
    - name: bnk-listener
      protocol: HTTP
      port: 80

      allowedRoutes:
        namespaces:
          from: All

        kinds:
          - kind: HTTPRoute

---
# maxAge: 초 단위 int (기본 5). preflight 의 Access-Control-Max-Age.
# exposeHeaders: 실제 CORS 응답에서 브라우저에 노출할 헤더. coffee 가 주는 X-Request-Id / X-Echo-Host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cors-expose-maxage-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener

  hostnames:
    - coffee.f5bnk.com

  rules:
    - filters:
        - cors:
            allowOrigins:
              - https://shop.f5bnk.com
            allowMethods:
              - GET
            exposeHeaders:
              - X-Request-Id
              - X-Echo-Host
            maxAge: 3600
          type: CORS

      backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 80
