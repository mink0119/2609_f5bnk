# 2.38 iRule 우회. native timeouts.request:5s 는 Accepted 이나 /delay/8 이 8s 200.
# after 는 동작. 콜백에서 HTTP::respond 는 무시됨 → TCP::respond 504 + TCP::close.
# HTTP_RESPONSE 에서 after cancel.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class
  addresses:
    - type: IPAddress
      value: 40.30.20.20
  listeners:
    - name: bnk-listener
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timeout-request-irule-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener
  hostnames:
    - coffee.f5bnk.com
  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com
---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 80
---
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: irule-timeout-request
  namespace: web
spec:
  iRule: |
    when HTTP_REQUEST {
      set req_to [after 5000 {
        TCP::respond "HTTP/1.1 504 Gateway Timeout\r\nContent-Type: text/plain\r\nContent-Length: 16\r\nConnection: close\r\n\r\ngateway timeout\n"
        TCP::close
      }]
    }
    when HTTP_RESPONSE {
      catch { after cancel $req_to }
    }
---
apiVersion: gateway.k8s.f5net.com/v1alpha1
kind: BNKNetPolicy
metadata:
  name: netpolicy-timeout-request
  namespace: web
spec:
  extensionRefs:
    - kind: F5BigCneIrule
      name: irule-timeout-request
      group: k8s.f5net.com
  targetRefs:
    - kind: Gateway
      name: http-gw
      group: gateway.networking.k8s.io
      sectionName: bnk-listener
