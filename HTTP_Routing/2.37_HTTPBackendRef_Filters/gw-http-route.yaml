apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class

  addresses:
    - type: IPAddress
      value: 40.30.20.20

  listeners:
    - name: bnk-listener
      protocol: HTTP
      port: 80

      allowedRoutes:
        namespaces:
          from: All

        kinds:
          - kind: HTTPRoute

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backendref-filter-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener

  hostnames:
    - coffee.f5bnk.com

  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com
          weight: 1
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                add:
                  - name: X-Backend
                    value: coffee
        - name: tea-pool
          kind: Pool
          group: k8s.f5net.com
          weight: 1

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 80

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: tea-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.11"
      port: 80

---
# Native backendRef.filters is Accepted but not applied (not per-backend).
# f5-bnk 2.9 analogue only: listener-wide path-branch header insert (not per-backendRef).
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: irule-backendref-filter
  namespace: web
spec:
  iRule: |
    when HTTP_REQUEST {
      if { [HTTP::uri] starts_with "/coffee" } {
        HTTP::header insert "X-Backend" "coffee"
      }
    }

---
apiVersion: gateway.k8s.f5net.com/v1alpha1
kind: BNKNetPolicy
metadata:
  name: netpolicy-backendref-filter
  namespace: web
spec:
  extensionRefs:
    - kind: F5BigCneIrule
      name: irule-backendref-filter
      group: k8s.f5net.com
  targetRefs:
    - kind: Gateway
      name: http-gw
      group: gateway.networking.k8s.io
      sectionName: bnk-listener
