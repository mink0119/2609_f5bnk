# 3.3 v2 backup — Gateway API TLSRoute (Passthrough)
# 본 파일 gw-tls-route.yaml 은 BNK native HTTPS Terminate + HTTPRoute.
# 이 v2 는 공식 TLSRoute: ClientHello SNI 로 backend 선택, Gateway는 TLS 미종료.
# https://gateway-api.sigs.k8s.io/reference/api-types/tlsroute/
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class

  addresses:
    - type: IPAddress
      value: 40.30.20.20

  listeners:
    - name: bnk-listener
      protocol: TLS
      port: 443

      tls:
        mode: Passthrough

      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: Terminate

---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-sni-coffee
  namespace: web
spec:
  parentRefs:
    - name: tls-gw
      sectionName: bnk-listener

  hostnames:
    - coffee.f5bnk.com

  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com

---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-sni-tea
  namespace: web
spec:
  parentRefs:
    - name: tls-gw
      sectionName: bnk-listener

  hostnames:
    - tea.f5bnk.com

  rules:
    - backendRefs:
        - name: tea-pool
          kind: Pool
          group: k8s.f5net.com

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 443

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: tea-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.11"
      port: 443
