# TLSRoute / protocol TLS 미지원. BNK native: HTTPS listener hostname + Secret
# 으로 ClientHello SNI가 인증서를 고르고, HTTPRoute hostnames로 백엔드를 고른다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class

  addresses:
    - type: IPAddress
      value: 40.30.20.20

  listeners:
    - name: bnk-listener
      protocol: HTTPS
      port: 443
      hostname: coffee.f5bnk.com

      tls:
        mode: Terminate
        certificateRefs:
          - name: coffee-tls-cert
            kind: Secret

      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute

    - name: bnk-listener-tea
      protocol: HTTPS
      port: 443
      hostname: tea.f5bnk.com

      tls:
        mode: Terminate
        certificateRefs:
          - name: tea-tls-cert
            kind: Secret

      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute

