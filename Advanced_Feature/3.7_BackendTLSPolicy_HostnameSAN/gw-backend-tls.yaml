---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-tls-match-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener

  hostnames:
    - coffee.f5bnk.com

  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-tls-mismatch-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener

  hostnames:
    - mismatch.f5bnk.com

  rules:
    - backendRefs:
        - name: tea-pool
          kind: Pool
          group: k8s.f5net.com

---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: coffee-backend-tls-match
  namespace: web
spec:
  targetRefs:
    - group: k8s.f5net.com
      kind: Pool
      name: coffee-pool
  validation:
    hostname: coffee.f5bnk.com
    subjectAltNames:
      - type: Hostname
        hostname: coffee.f5bnk.com
    caCertificateRefs:
      - name: backend-ca
        group: ""
        kind: ConfigMap

---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: tea-backend-tls-mismatch
  namespace: web
spec:
  targetRefs:
    - group: k8s.f5net.com
      kind: Pool
      name: tea-pool
  validation:
    hostname: coffee.f5bnk.com
    subjectAltNames:
      - type: Hostname
        hostname: coffee.f5bnk.com
    caCertificateRefs:
      - name: backend-ca
        group: ""
        kind: ConfigMap

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 443

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: tea-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.11"
      port: 443
