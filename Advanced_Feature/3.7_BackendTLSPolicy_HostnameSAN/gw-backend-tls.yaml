# HTTPS Terminate + BackendTLSPolicy (재암호화). Pool :443.
# CRD는 있으나 BNK 컨트롤러가 처리하지 않으면 status 비어 있고 upstream은 plain HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class
  addresses:
  - type: IPAddress
    value: 40.30.20.20
  listeners:
  - name: bnk-listener
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
    tls:
      mode: Terminate
      certificateRefs:
      - name: web-tls-cert
        kind: Secret
---
