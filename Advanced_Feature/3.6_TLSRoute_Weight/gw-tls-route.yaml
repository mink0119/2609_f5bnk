# TLSRoute 미지원. BNK native: HTTPS Terminate + HTTPRoute backendRefs.weight
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class

  addresses:
    - type: IPAddress
      value: 40.30.20.20

  listeners:
    - name: bnk-listener
      protocol: HTTPS
      port: 443

      tls:
        mode: Terminate
        certificateRefs:
          - name: web-tls-cert
            kind: Secret

      allowedRoutes:
        namespaces:
          from: All

        kinds:
          - kind: HTTPRoute

