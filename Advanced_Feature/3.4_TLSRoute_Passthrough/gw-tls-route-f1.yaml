# 3.4 v2 — TLSRoute 없이 Gateway listener tls.mode: Passthrough
# 본파일 gw-tls-route.yaml 은 TCP + L4Route.
# 이 v2 는 protocol TLS + Passthrough. 백엔드는 BNK native HTTPRoute → Pool :443.
# https://gateway-api.sigs.k8s.io/reference/api-types/tlsroute/
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class

  addresses:
    - type: IPAddress
      value: 40.30.20.20

  listeners:
    - name: bnk-listener
      protocol: TLS
      port: 443

      tls:
        mode: Passthrough

      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-passthrough-route
  namespace: web
spec:
  parentRefs:
    - name: tls-gw
      sectionName: bnk-listener

  hostnames:
    - coffee.f5bnk.com

  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 443
