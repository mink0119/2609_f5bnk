# TLSRoute kind / listener protocol TLS 는 BNK에서 UnsupportedProtocol.
# BNK native Passthrough: Gateway protocol TCP :443 + L4Route → 백엔드 TLS :443.
# Gateway가 TLS를 종료하지 않으므로 client가 보는 인증서는 백엔드 coffee.crt.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class

  addresses:
    - type: IPAddress
      value: 40.30.20.20

  listeners:
    - name: bnk-listener
      protocol: TCP
      port: 443

      allowedRoutes:
        namespaces:
          from: All

        kinds:
          - kind: L4Route
            group: gateway.k8s.f5net.com

---
apiVersion: gateway.k8s.f5net.com/v1
kind: L4Route
metadata:
  name: tls-passthrough-route
  namespace: web
spec:
  protocol: TCP
  parentRefs:
    - name: tls-gw
      sectionName: bnk-listener

  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com

---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 443
