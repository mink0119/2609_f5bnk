# 3.15 iRule 우회. native GRPCRoute sessionPersistence 는 CRD 스키마 거부.
# 2.43 과 같이 Cookie→pool. gRPC 는 -H 'cookie: BNKSESSION=coffee'.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class
  addresses:
    - type: IPAddress
      value: 40.30.20.20
  listeners:
    - name: bnk-listener
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: GRPCRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-session-irule-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener
  hostnames:
    - grpc.f5bnk.com
  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com
          weight: 1
        - name: tea-pool
          kind: Pool
          group: k8s.f5net.com
          weight: 1
---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 50051
---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: tea-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.11"
      port: 50051
---
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: irule-grpc-session
  namespace: web
spec:
  iRule: |
    when HTTP_REQUEST {
      set have_sess 0
      set ck [HTTP::header "Cookie"]
      if { $ck contains "BNKSESSION=tea" } {
        set have_sess 1
        pool web-pool-tea-pool-pool
      } elseif { $ck contains "BNKSESSION=coffee" } {
        set have_sess 1
        pool web-pool-coffee-pool-pool
      }
    }
    when LB_SELECTED {
      set persist_member [LB::server addr]
    }
    when HTTP_RESPONSE {
      if { $have_sess == 0 } {
        if { $persist_member eq "30.0.0.10" } {
          HTTP::header insert "Set-Cookie" "BNKSESSION=coffee; Path=/; Max-Age=3600"
        } elseif { $persist_member eq "30.0.0.11" } {
          HTTP::header insert "Set-Cookie" "BNKSESSION=tea; Path=/; Max-Age=3600"
        }
      }
    }
---
apiVersion: gateway.k8s.f5net.com/v1alpha1
kind: BNKNetPolicy
metadata:
  name: netpolicy-grpc-session
  namespace: web
spec:
  extensionRefs:
    - kind: F5BigCneIrule
      name: irule-grpc-session
      group: k8s.f5net.com
  targetRefs:
    - kind: Gateway
      name: http-gw
      group: gateway.networking.k8s.io
      sectionName: bnk-listener
