# 3.12 iRule 우회. native GRPCRoute filters HeaderModifier 미적용.
# HTTP::header insert. 요청 X-PoC-Add, 응답 X-PoC-Res-Add. h2 metadata 로 보이는지 live 확인.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http-gw
  namespace: web
spec:
  gatewayClassName: f5-bnk-gateway-class
  addresses:
    - type: IPAddress
      value: 40.30.20.20
  listeners:
    - name: bnk-listener
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: GRPCRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-modifier-irule-route
  namespace: web
spec:
  parentRefs:
    - name: http-gw
      sectionName: bnk-listener
  hostnames:
    - grpc.f5bnk.com
  rules:
    - backendRefs:
        - name: coffee-pool
          kind: Pool
          group: k8s.f5net.com
---
apiVersion: k8s.f5net.com/v1
kind: Pool
metadata:
  name: coffee-pool
  namespace: web
spec:
  members:
    - address: "30.0.0.10"
      port: 50051
---
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: irule-grpc-modifier
  namespace: web
spec:
  iRule: |
    when HTTP_REQUEST {
      HTTP::header insert "X-PoC-Add" "added"
    }
    when HTTP_RESPONSE {
      HTTP::header insert "X-PoC-Res-Add" "added"
    }
---
apiVersion: gateway.k8s.f5net.com/v1alpha1
kind: BNKNetPolicy
metadata:
  name: netpolicy-grpc-modifier
  namespace: web
spec:
  extensionRefs:
    - kind: F5BigCneIrule
      name: irule-grpc-modifier
      group: k8s.f5net.com
  targetRefs:
    - kind: Gateway
      name: http-gw
      group: gateway.networking.k8s.io
      sectionName: bnk-listener
